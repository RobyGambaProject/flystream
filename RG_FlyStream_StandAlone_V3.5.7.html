<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>RGproject_StandAlone_V3.1.7</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* --- [REM] STILI GENERALI E POSIZIONAMENTO --- */
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* [REM] Mappa con centro traslato per compensare la dashboard */
        #map { 
            position: absolute; 
            top: 50%; left: 50%; 
            width: 220vmax; height: 220vmax; 
            margin-top: -110vmax; margin-left: -110vmax; 
            transition: transform 0.2s linear, filter 0.3s ease; 
        }

        /* --- [REM] DASHBOARD E TOP BAR --- */
        #dashboard { 
            position: absolute; top: 0; left: 0; width: 100%; height: 110px; 
            background: white; z-index: 2000; display: grid; 
            grid-template-columns: 1fr 1fr 1fr; border-bottom: 2px solid #2c3e50; 
            align-items: center; 
        }
        .box { border-right: 1px solid #ccc; padding: 5px; text-align: center; }
        .label { font-size: 14px; font-weight: 800; color: #2980b9; display: block; text-transform: uppercase; }
        .val { font-size: 52px; font-weight: 900; color: #2c3e50; line-height: 1; }

        /* --- [REM] INDICATORE MODALITÀ --- */
        #zoom-feedback {
            position: absolute; bottom: -22px; right: 10px; 
            background: #2c3e50; color: white; padding: 2px 15px; border-radius: 0 0 8px 8px;
            font-size: 11px; font-weight: bold; text-transform: uppercase;
            border: 1px solid #2c3e50; border-top: none;
        }

        /* --- [REM] BOX VENTO E AFFIDABILITÀ --- */
        #wind-container { position: absolute; top: 130px; right: 20px; z-index: 2500; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        #wind-box { background: rgba(255,255,255,0.9); padding: 8px; border-radius: 50%; border: 2px solid #2c3e50; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; }
        #wind-deg-box { background: rgba(44, 62, 80, 0.95); color: white; min-width: 95px; border-radius: 8px; padding: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        #wind-val { font-size: 22px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.4); display: block; margin-bottom: 6px; }
        .wind-rel-info { font-size: 13px; text-align: left; line-height: 1.5; color: #ecf0f1; }
        .rel-val { color: #f1c40f; font-weight: bold; }

        /* --- [REM] PILOTA (SPOSTATO AL 65% VERTICALE) --- */
        #pilot { 
            position: fixed; 
            top: 65%; /* [REM] Spostato verso il basso per aumentare la visuale anteriore */
            left: 50%; 
            transform: translate(-50%, -50%); 
            z-index: 5000; width: 35px; pointer-events: none; 
        }

        /* --- [REM] FIRMA E VERSIONE --- */
        #signature-box { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            z-index: 4000; background: rgba(255,255,255,0.85); padding: 6px 18px; 
            border-radius: 20px; border: 1.5px solid #2c3e50; font-family: "Comic Sans MS", cursive; 
            font-size: 14px; font-weight: bold; color: #2c3e50; display: flex; align-items: center; gap: 8px;
        }
        .ver-span { font-family: monospace; font-size: 11px; background: #2c3e50; color: white; padding: 2px 6px; border-radius: 4px; }
        
        #aeroCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; opacity: 0.6; }
        #agl-txt { color: #e67e22; }
    </style>
</head>
<body>

<div id="signature-box">RG Project Stand-Alone <span class="ver-span">V.3.1.7</span></div>

<div id="dashboard">
    <div class="box"><span class="label">Quota (m)</span><span id="alt-txt" class="val">---</span></div>
    <div class="box"><span class="label">Vento (km/h)</span><span id="spd-txt" class="val">---</span></div>
    <div class="box"><span class="label">AGL (m)</span><span id="agl-txt" class="val">---</span></div>
    <div id="zoom-feedback">MODE: <span id="zoom-status">STRATEGICA</span></div>
</div>

<div id="wind-container">
    <div id="wind-box" onclick="toggleZoom()">
        <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </div>
    <div id="wind-deg-box">
        <span id="wind-val">0°</span>
        <div class="wind-rel-info">
            <div class="rel-item">🕒 <span id="rel-time" class="rel-val">0'</span></div>
            <div class="rel-item">📍 <span id="rel-dist" class="rel-val">0k</span></div>
            <div class="rel-item">🏔️ <span id="rel-alt" class="rel-val">0m</span></div>
        </div>
    </div>
</div>

<svg id="pilot" viewBox="0 0 24 24" fill="#3498db" stroke="white" stroke-width="1.5"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>

<div id="viewport"><div id="map"></div></div>
<canvas id="aeroCanvas"></canvas>

<script>
    /* ---------------------------------------------------------
       [ROUTINE: VARIABILI DI STATO E COSTANTI]
       --------------------------------------------------------- */
    const PUNTI_PER_GRADO = 1200; 
    const STEP_METRI = 90;
    let terrainData = null, currentTile = "", map = null, canvas = null, ctx = null;
    let isTacticMode = false;
    let flight = { lat: 0, lon: 0, hdg: 0, alt: 0, windSpd: 0, windDir: 0 };
    let lastWindUpdate = { time: Date.now(), lat: 0, lon: 0, alt: 0 };

    /* ---------------------------------------------------------
       [ROUTINE: INIZIALIZZAZIONE SISTEMA]
       --------------------------------------------------------- */
    function init() {
        canvas = document.getElementById('aeroCanvas');
        ctx = canvas.getContext('2d');
        
        // [REM] Inizializzazione Leaflet
        map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false }).setView([44.8, 9.1], 12);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);

        // [REM] Attivazione monitoraggio GPS
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
        }

        window.onresize = resize;
        resize();
        setInterval(refreshReliabilityUI, 5000);
    }

    /* ---------------------------------------------------------
       [ROUTINE: AGGIORNAMENTO POSIZIONE E OFFSET MAPPA]
       --------------------------------------------------------- */
    function updatePosition(pos) {
        flight.lat = pos.coords.latitude;
        flight.lon = pos.coords.longitude;
        flight.alt = Math.round(pos.coords.altitude || 0);
        flight.hdg = pos.coords.heading || 0;
        
        // [REM] Calcolo del centro mappa con offset verticale
        // Convertiamo l'offset desiderato (65% dello schermo) in coordinate geografiche
        let zoom = map.getZoom();
        let offsetPx = window.innerHeight * 0.15; // Spostiamo la mappa in su del 15%
        let center = map.unproject(map.project([flight.lat, flight.lon], zoom).add([0, offsetPx]), zoom);

        map.setView(center, zoom, { animate: false });
        
        updateView();
    }

    /* ---------------------------------------------------------
       [ROUTINE: AGGIORNAMENTO GRAFICA E DASHBOARD]
       --------------------------------------------------------- */
    async function updateView() {
        if (flight.lat === 0) return;
        
        // [REM] Rotazione mappa basata sull'heading
        document.getElementById('map').style.transform = `rotate(${-flight.hdg}deg)`;
        
        // [REM] Aggiornamento testi Dashboard
        document.getElementById('alt-txt').innerText = flight.alt;
        document.getElementById('spd-txt').innerText = flight.windSpd;
        
        // [REM] Aggiornamento freccia vento
        let arrowRot = (flight.windDir - flight.hdg) + 180;
        document.getElementById('wind-arrow').style.transform = `rotate(${arrowRot}deg)`;
        document.getElementById('wind-val').innerText = Math.round(flight.windDir) + "°";

        // [REM] Caricamento dinamico tiles orografici
        let tID = `map_${Math.floor(flight.lat)}_${Math.floor(flight.lon)}`;
        if (currentTile !== tID) {
            try {
                let res = await fetch(`data_json/${tID}.json`);
                if (res.ok) { terrainData = (await res.json()).data; currentTile = tID; }
            } catch(e) {}
        }
        drawAnalysis();
    }

    /* ---------------------------------------------------------
       [ROUTINE: CALCOLO ANALISI OROGRAFICA (CORE)]
       --------------------------------------------------------- */
    function drawAnalysis() {
        if (!terrainData) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let wspd = flight.windSpd, wdir = flight.windDir;
        let rad = (wdir - 90) * (Math.PI / 180);
        let vx = -Math.cos(rad), vy = Math.sin(rad);
        
        let res = 6; 
        let rangeIdx = 0.045 / Math.pow(2, (map.getZoom() - 12));
        
        // [REM] Punto centrale dello schermo per AGL (deve coincidere con la posizione visiva del pilota)
        let visualPilotY = canvas.height * 0.65;

        for (let x = 0; x < canvas.width; x += res) {
            for (let y = 0; y < canvas.height; y += res) {
                // [REM] Trasformazione coordinate pixel -> geografiche tenendo conto della rotazione hdg
                let relX = (x - canvas.width / 2) / (canvas.width / 2) * rangeIdx;
                let relY = -(y - visualPilotY) / (canvas.height / 2) * rangeIdx;
                
                let aH = -flight.hdg * (Math.PI / 180);
                let pLon = flight.lon + (relX * Math.cos(aH) - relY * Math.sin(aH));
                let pLat = flight.lat + (relX * Math.sin(aH) + relY * Math.cos(aH));
                
                let cx = Math.floor((pLon % 1) * PUNTI_PER_GRADO);
                let cy = (PUNTI_PER_GRADO - 1) - Math.floor((pLat % 1) * PUNTI_PER_GRADO);
                
                if (terrainData[cy] && terrainData[cy][cx]) {
                    let h = terrainData[cy][cx];
                    if (Math.abs(x - canvas.width/2) < res && Math.abs(y - visualPilotY) < res) {
                        document.getElementById('agl-txt').innerText = Math.round(flight.alt - h);
                    }
                    if (h >= flight.alt) { ctx.fillStyle = "rgba(40,40,40,0.8)"; ctx.fillRect(x,y,res,res); continue; }
                    
                    // [REM] Calcolo zone di sottovento e turbolenza (Vedi versioni precedenti per dettagli logica)
                    ctx.fillStyle = "rgba(0,0,0,0)"; 
                    ctx.fillRect(x,y,res,res);
                }
            }
        }
    }

    /* ---------------------------------------------------------
       [ROUTINE: GESTIONE ZOOM E RESIZE]
       --------------------------------------------------------- */
    function toggleZoom() {
        isTacticMode = !isTacticMode;
        map.setZoom(isTacticMode ? 14.6 : 12, { animate: true });
        document.getElementById('zoom-status').innerText = isTacticMode ? "TATTICA" : "STRATEGICA";
        document.getElementById('zoom-feedback').style.background = isTacticMode ? "#e67e22" : "#2c3e50";
    }

    function refreshReliabilityUI() {
        let diffMin = Math.floor((Date.now() - lastWindUpdate.time) / 60000);
        document.getElementById('rel-time').innerText = diffMin + "'";
        document.getElementById('rel-alt').innerText = lastWindUpdate.alt + "m";
    }

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    init();
</script>
</body>
</html>
