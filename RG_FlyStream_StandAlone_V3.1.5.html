<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>RGproject_StandAlone_V3.1.5_Doc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* --- STILI GENERALI E VIEWPORT --- */
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* Mappa sovradimensionata per rotazione fluida senza bordi neri */
        #map { 
            position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax; 
            margin-top: -110vmax; margin-left: -110vmax; 
            transition: transform 0.2s linear, filter 0.3s ease; 
        }
        
        /* Canvas overlay per analisi orografica */
        #aeroCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; opacity: 0.6; }
        
        /* --- DASHBOARD DATI --- */
        #dashboard { 
            position: absolute; top: 0; left: 0; width: 100%; height: 110px; 
            background: white; z-index: 2000; display: grid; grid-template-columns: 1fr 1fr 1fr; 
            border-bottom: 2px solid #2c3e50; align-items: center; 
        }
        .box { border-right: 1px solid #ccc; padding: 5px; text-align: center; }
        .label { font-size: 14px; font-weight: 800; color: #2980b9; display: block; text-transform: uppercase; }
        .val { font-size: 52px; font-weight: 900; color: #2c3e50; line-height: 1; }

        /* --- WIND & RELIABILITY UI --- */
        #wind-container { 
            position: absolute; top: 130px; right: 20px; z-index: 2500; 
            display: flex; flex-direction: column; align-items: center; gap: 5px; 
        }
        #wind-box { 
            background: rgba(255,255,255,0.9); padding: 8px; border-radius: 50%; 
            border: 2px solid #2c3e50; width: 65px; height: 65px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;
        }
        #wind-arrow { width: 45px; height: 45px; transition: transform 0.3s linear; }

        /* Box Gradi + Metriche Affidabilità */
        #wind-deg-box { 
            background: rgba(44, 62, 80, 0.9); color: white; min-width: 75px; 
            border-radius: 6px; font-family: 'Courier New', monospace; padding: 6px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); text-align: center;
        }
        #wind-val { font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.3); display: block; margin-bottom: 4px; }
        .wind-rel-info { font-size: 10px; text-align: left; line-height: 1.3; color: #bdc3c7; }
        .rel-item { display: flex; justify-content: space-between; }
        .rel-val { color: #f1c40f; font-weight: bold; padding-left: 4px; }

        /* --- CONFIGURAZIONE E FIRMA --- */
        #config-panel { 
            position: absolute; top: 120px; left: 10px; z-index: 3500; 
            background: rgba(255,255,255,0.95); padding: 10px; border-radius: 8px; 
            border: 2px solid #2c3e50; font-size: 12px; font-weight: bold;
        }
        #signature-box { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            z-index: 4000; background: rgba(255,255,255,0.85); padding: 5px 15px; 
            border-radius: 20px; border: 1.5px solid #2c3e50; font-family: cursive; 
            font-size: 12px; font-weight: bold; color: #2c3e50;
        }
        #pilot { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000; width: 35px; pointer-events: none; }
        #agl-txt { color: #e67e22; }
    </style>
</head>
<body>

<div id="signature-box">RG Project Stand-Alone <span style="background:#2c3e50; color:white; padding:2px 6px; border-radius:4px; margin-left:5px; font-family:monospace;">V.3.1.5</span></div>

<div id="dashboard">
    <div class="box"><span class="label">Quota (m)</span><span id="alt-txt" class="val">---</span></div>
    <div class="box"><span class="label">Vento (km/h)</span><span id="spd-txt" class="val">---</span></div>
    <div class="box"><span class="label">AGL (m)</span><span id="agl-txt" class="val">---</span></div>
</div>

<div id="config-panel">
    GPS: <span id="gps-status" style="color:red;">DISCONNESSO</span><br><br>
    <div style="margin-bottom:5px;"><input type="checkbox" id="chkDynamic" checked> SCIA DINAMICA</div>
    <div><input type="checkbox" id="chkMapBN"> MAPPA B/N</div>
</div>

<div id="wind-container">
    <div id="wind-box" onclick="toggleZoom()" title="Click per Zoom Tattico">
        <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </div>
    <div id="wind-deg-box">
        <span id="wind-val">0°</span>
        <div class="wind-rel-info">
            <div class="rel-item">🕒 <span id="rel-time" class="rel-val">0'</span></div>
            <div class="rel-item">📍 <span id="rel-dist" class="rel-val">0k</span></div>
            <div class="rel-item">🏔️ <span id="rel-alt" class="rel-val">0m</span></div>
        </div>
    </div>
</div>

<svg id="pilot" viewBox="0 0 24 24" fill="#3498db" stroke="white" stroke-width="1.5"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>

<div id="viewport"><div id="map"></div></div>
<canvas id="aeroCanvas"></canvas>

<script>
    /* --- COSTANTI SISTEMA --- */
    const PUNTI_PER_GRADO = 1200; // Risoluzione SRTM1
    const STEP_METRI = 90;        // Campionamento orografico
    
    /* --- VARIABILI GLOBALI --- */
    let terrainData = null, currentTile = "", map = null, canvas = null, ctx = null;
    let isDynamic = true, isBN = false, isTacticMode = false;
    
    // Telemetria attuale
    let flight = { lat: 0, lon: 0, hdg: 0, alt: 0, windSpd: 0, windDir: 0 };
    
    // Memoria per metriche affidabilità vento
    let lastWindUpdate = { 
        time: Date.now(), 
        lat: 0, 
        lon: 0, 
        alt: 0 
    };

    /* --- ROUTINE: INIZIALIZZAZIONE --- */
    function init() {
        canvas = document.getElementById('aeroCanvas');
        ctx = canvas.getContext('2d');
        
        // Setup Mappa Base
        map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false }).setView([44.8, 9.1], 12);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);

        // Attivazione GPS Browser (Richiede HTTPS)
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(updatePosition, 
                (err) => { document.getElementById('gps-status').innerText = "ERRORE GPS"; }, 
                { enableHighAccuracy: true, maximumAge: 1000 }
            );
        }

        // Listener Controlli
        document.getElementById('chkDynamic').addEventListener('change', (e) => isDynamic = e.target.checked);
        document.getElementById('chkMapBN').addEventListener('change', (e) => { isBN = e.target.checked; applyMapStyle(); });
        
        window.onresize = resize;
        resize();
        
        // Loop aggiornamento metriche affidabilità (ogni 5 secondi)
        setInterval(refreshReliabilityUI, 5000);
    }

    /* --- ROUTINE: GESTIONE DATI GPS POSIZIONE --- */
    function updatePosition(pos) {
        const statusEl = document.getElementById('gps-status');
        statusEl.innerText = "LIVE";
        statusEl.style.color = "#27ae60";
        
        flight.lat = pos.coords.latitude;
        flight.lon = pos.coords.longitude;
        flight.alt = Math.round(pos.coords.altitude || 0);
        flight.hdg = pos.coords.heading || 0;

        // Qui verranno inseriti i calcoli per l'analisi dello scarroccio (drift)
        // updateWindDriftLogic(pos.coords);

        updateView();
    }

    /* --- ROUTINE: REFRESH METRICHE AFFIDABILITÀ --- */
    function refreshReliabilityUI() {
        // Calcolo tempo trascorso
        let diffMin = Math.floor((Date.now() - lastWindUpdate.time) / 60000);
        document.getElementById('rel-time').innerText = diffMin + "'";

        // Calcolo distanza percorsa dall'ultimo punto di calcolo vento
        if (lastWindUpdate.lat !== 0) {
            let dist = calculateHaversine(flight.lat, flight.lon, lastWindUpdate.lat, lastWindUpdate.lon);
            document.getElementById('rel-dist').innerText = dist.toFixed(1) + "k";
        }

        // Visualizzazione quota di riferimento
        document.getElementById('rel-alt').innerText = lastWindUpdate.alt + "m";
    }

    /* --- ROUTINE: CALCOLO DISTANZA GEODETICA (KM) --- */
    function calculateHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371; // Raggio terrestre
        let dLat = (lat2-lat1) * Math.PI / 180;
        let dLon = (lon2-lon1) * Math.PI / 180;
        let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    /* --- ROUTINE: AGGIORNAMENTO GRAFICA E MAPPA --- */
    async function updateView() {
        if (flight.lat === 0) return;
        
        // Centratura mappa e rotazione prua
        map.setView([flight.lat, flight.lon], map.getZoom(), { animate: false });
        document.getElementById('map').style.transform = `rotate(${-flight.hdg}deg)`;
        
        // Testi Dashboard
        document.getElementById('alt-txt').innerText = flight.alt;
        document.getElementById('spd-txt').innerText = flight.windSpd;
        
        // Rotazione Freccia Vento
        let arrowRot = (flight.windDir - flight.hdg) + 180;
        document.getElementById('wind-arrow').style.transform = `rotate(${arrowRot}deg)`;
        document.getElementById('wind-val').innerText = Math.round(flight.windDir) + "°";

        // Caricamento Dati Orogrfici (JSON)
        let tID = `map_${Math.floor(flight.lat)}_${Math.floor(flight.lon)}`;
        if (currentTile !== tID) {
            try {
                let res = await fetch(`data_json/${tID}.json`);
                if (res.ok) { terrainData = (await res.json()).data; currentTile = tID; }
            } catch(e) {}
        }
        drawAnalysis();
    }

    /* --- ROUTINE: CALCOLO ANALISI OROGRAFICA (CORE) --- */
    function drawAnalysis() {
        if (!terrainData) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let wspd = flight.windSpd, wdir = flight.windDir;
        let rad = (wdir - 90) * (Math.PI / 180);
        let vx = -Math.cos(rad), vy = Math.sin(rad); // Vettori vento
        
        let res = 6; 
        let rangeIdx = 0.045 / Math.pow(2, (map.getZoom() - 12));
        
        // Logica Scia: dropValue definisce l'inclinazione dell'ombra (efficienza vento)
        let dropValue = Math.max(8, 40 - (wspd * 0.8));
        let maxSteps = isDynamic ? Math.min(16, Math.floor(wspd / 1.5) + 4) : 6;

        for (let x = 0; x < canvas.width; x += res) {
            for (let y = 0; y < canvas.height; y += res) {
                // Coordinate relative
                let relX = (x - canvas.width / 2) / (canvas.width / 2) * rangeIdx;
                let relY = -(y - canvas.height / 2) / (canvas.height / 2) * rangeIdx;
                let aH = -flight.hdg * (Math.PI / 180);
                
                // Proiezione Lat/Lon
                let pLon = flight.lon + (relX * Math.cos(aH) - relY * Math.sin(aH));
                let pLat = flight.lat + (relX * Math.sin(aH) + relY * Math.cos(aH));
                
                let cx = Math.floor((pLon % 1) * PUNTI_PER_GRADO);
                let cy = (PUNTI_PER_GRADO - 1) - Math.floor((pLat % 1) * PUNTI_PER_GRADO);
                
                if (terrainData[cy] && terrainData[cy][cx]) {
                    let h = terrainData[cy][cx];
                    
                    // Aggiornamento AGL (Al centro pilota)
                    if (Math.abs(x - canvas.width/2) < res && Math.abs(y - canvas.height/2) < res) {
                        document.getElementById('agl-txt').innerText = Math.round(flight.alt - h);
                    }
                    
                    // Disegno Montagna (Sotto quota volo)
                    if (h >= flight.alt) {
                        ctx.fillStyle = "rgba(40,40,40,0.8)";
                        ctx.fillRect(x,y,res,res); continue;
                    }

                    // Verifica Sottovento (Shadow Cast)
                    let inWake = false;
                    for (let d = 1; d <= maxSteps; d++) {
                        let lx = Math.floor(((pLon - vx*0.00025*d) % 1) * PUNTI_PER_GRADO);
                        let ly = (PUNTI_PER_GRADO-1) - Math.floor(((pLat - vy*0.00025*d) % 1) * PUNTI_PER_GRADO);
                        if (terrainData[ly] && terrainData[ly][lx] > (flight.alt - (d * dropValue))) { 
                            inWake = true; break; 
                        }
                    }

                    // Calcolo Vento Relativo (Ascendenza/Discendenza)
                    let gx = ((terrainData[cy][cx+1]||h)-(terrainData[cy][cx-1]||h))/(2*STEP_METRI);
                    let gy = ((terrainData[cy+1]?terrainData[cy+1][cx]:h)-(terrainData[cy-1]?terrainData[cy-1][cx]:h))/(2*STEP_METRI);
                    let force = (vx * gx + vy * gy) * (wspd / 10);

                    // Colore Pixel in base all'analisi
                    if (inWake) ctx.fillStyle = "rgba(100,100,100,0.6)"; // Grigio: Sottovento
                    else if (force < -0.12) ctx.fillStyle = "rgba(231,76,60,0.7)"; // Rosso: Pericolo discendenza
                    else if (force > 0.08) ctx.fillStyle = "rgba(46,204,113,0.6)"; // Verde: Potenziale ascendenza
                    else ctx.fillStyle = "rgba(0,0,0,0)";
                    
                    ctx.fillRect(x,y,res,res);
                }
            }
        }
    }

    /* --- ROUTINE: GESTIONE ZOOM --- */
    function toggleZoom() {
        isTacticMode = !isTacticMode;
        map.setZoom(isTacticMode ? 14.6 : 12, { animate: true });
    }

    /* --- ROUTINE: STILE MAPPA --- */
    function applyMapStyle() {
        document.getElementById('map').style.filter = isBN ? "grayscale(1) contrast(1.8) opacity(0.8)" : "none";
    }

    /* --- ROUTINE: RESIZE FINESTRA --- */
    function resize() { 
        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight; 
    }

    // ESECUZIONE INIZIALE
    init();
</script>
</body>
</html>
