<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>RGproject_AI_FlyStreamV2.5.5</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* --- STILI GENERALI --- */
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* --- MAPPA --- */
        #map { 
            position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax; 
            margin-top: -110vmax; margin-left: -110vmax; 
            transition: transform 0.1s linear, filter 0.3s ease; 
        }
        
        /* --- CANVAS ANALISI OROGRAFICA --- */
        #aeroCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; opacity: 0.6; }
        
        /* --- DASHBOARD DATI --- */
        #dashboard { position: absolute; top: 0; left: 0; width: 100%; height: 110px; background: white; z-index: 2000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 2px solid #2c3e50; align-items: center; }
        .box { border-right: 1px solid #ccc; padding: 5px; text-align: center; }
        .label { font-size: 14px; font-weight: 800; color: #2980b9; display: block; text-transform: uppercase; }
        .val { font-size: 52px; font-weight: 900; color: #2c3e50; line-height: 1; }

        /* --- FEEDBACK ZOOM DASHBOARD --- */
        #zoom-feedback {
            position: absolute; 
            bottom: -22px; 
            right: 10px; 
            background: #2c3e50; 
            color: white; 
            padding: 2px 15px; 
            border-radius: 0 0 8px 8px;
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: background 0.3s ease; 
            border: 1px solid #2c3e50; 
            border-top: none;
        }

        /* --- PANNELLO CONFIGURAZIONE --- */
        #config-panel {
            position: absolute; top: 120px; left: 10px; z-index: 3500;
            background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 10px;
            border: 2px solid #2c3e50; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 12px; min-width: 180px;
        }

        /* --- ELEMENTO FIRMA + VERSIONE UNIFICATO --- */
        #signature-box { 
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
            z-index: 4000; background: rgba(255, 255, 255, 0.85); padding: 6px 18px; 
            border-radius: 20px; border: 1.5px solid #2c3e50; font-family: "Comic Sans MS", cursive; 
            font-size: 14px; font-weight: bold; color: #2c3e50; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .ver-span { font-family: monospace; font-size: 11px; background: #2c3e50; color: white; padding: 1px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }

        /* --- ELEMENTI INTERATTIVI --- */
        #wind-box { 
            position: absolute; top: 130px; right: 20px; z-index: 2500; 
            background: rgba(255,255,255,0.9); padding: 8px; border-radius: 50%; 
            border: 2px solid #2c3e50; width: 65px; height: 65px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: transform 0.1s ease;
        }
        #wind-box:active { transform: scale(0.9); }
        #wind-arrow { width: 45px; height: 45px; transition: transform 0.2s linear; }
        #pilot { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000 !important; width: 35px; pointer-events: none; }
        #agl-txt { color: #e67e22; }
        .ctrl-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .ctrl-row label { font-weight: 900; font-size: 13px; color: #2c3e50; pointer-events: none; }
    </style>
</head>
<body>

<div id="signature-box">
    RG Project - AI FlyStream <span class="ver-span">V.2.5.5</span>
</div>

<div id="dashboard">
    <div class="box"><span class="label">Quota (m)</span><span id="alt-txt" class="val">---</span></div>
    <div class="box"><span class="label">Vento (km/h)</span><span id="spd-txt" class="val">---</span></div>
    <div class="box"><span class="label">AGL (m)</span><span id="agl-txt" class="val">---</span></div>
    <div id="zoom-feedback">MODE: <span id="zoom-status">STRATEGICA</span></div>
</div>

<div id="config-panel">
    <div class="ctrl-row">
        <input type="checkbox" id="chkDynamic" style="transform: scale(1.5);">
        <label for="chkDynamic">SCIA DINAMICA</label>
    </div>
    <div class="ctrl-row">
        <input type="checkbox" id="chkMapBN" style="transform: scale(1.5);">
        <label for="chkMapBN">MAPPA B/N (ISOIPSE)</label>
    </div>
</div>

<div id="wind-box" title="Clicca per zoom Tattico/Strategico">
    <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
</div>

<svg id="pilot" viewBox="0 0 24 24" fill="#3498db" stroke="white" stroke-width="1.5">
    <path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/>
</svg>

<div id="viewport"><div id="map"></div></div>
<canvas id="aeroCanvas"></canvas>

<script>

    const STEP_METRI = 90;
    let terrainData = null;
    let currentTile = "";
    let map = null;
    let canvas = null;
    let ctx = null;
    let isDynamic = true;
    let isBN = false;
    let isTacticMode = false; // Stato Zoom (false = 12 Strategico, true = 14.6 Tattico)
    let flight = { lat: 44.8, lon: 9.1, hdg: 0, alt: 0, speed: 0, windSpd: 0, windDir: 0 };

    /* --- ROUTINE: INIZIALIZZAZIONE APP --- */
    function init() {
        let savedDynamic, savedBN, cbDyn, cbBN;
        try {
            savedDynamic = localStorage.getItem('rg_isDynamic');
            savedBN = localStorage.getItem('rg_isBN');
            if (savedDynamic !== null) isDynamic = (savedDynamic === 'true');
            if (savedBN !== null) isBN = (savedBN === 'true');
        } catch (e) {}

        canvas = document.getElementById('aeroCanvas');
        ctx = canvas.getContext('2d');

        // Partenza obbligatoria in modalità STRATEGICA (Zoom 12)
        map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false }).setView([44.8, 9.1], 12);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);

        const windBtn = document.getElementById('wind-box');
        windBtn.addEventListener('click', toggleZoom);
        windBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleZoom(); });

        cbDyn = document.getElementById('chkDynamic');
        cbBN = document.getElementById('chkMapBN');
        cbDyn.checked = isDynamic;
        cbBN.checked = isBN;
        cbDyn.addEventListener('change', (e) => { isDynamic = e.target.checked; localStorage.setItem('rg_isDynamic', isDynamic); });
        cbBN.addEventListener('change', (e) => { isBN = e.target.checked; localStorage.setItem('rg_isBN', isBN); applyMapStyle(); });
        
        applyMapStyle();
        window.onresize = resize;
        resize();
        setInterval(updateFromXCTrack, 500);
    }

    /* --- ROUTINE: GESTIONE FLIP-FLOP ZOOM --- */
    function toggleZoom() {
        isTacticMode = !isTacticMode;
        const targetZoom = isTacticMode ? 14.6 : 12;
        const statusTxt = document.getElementById('zoom-status');
        const feedbackBox = document.getElementById('zoom-feedback');
        
        map.setZoom(targetZoom, { animate: true });
        
        if (isTacticMode) {
            statusTxt.innerText = "TATTICA";
            feedbackBox.style.background = "#e67e22"; 
        } else {
            statusTxt.innerText = "STRATEGICA";
            feedbackBox.style.background = "#2c3e50"; 
        }
    }
