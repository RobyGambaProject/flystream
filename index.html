<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>FlyStream Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        #map { position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax; margin-top: -110vmax; margin-left: -110vmax; transition: transform 0.1s linear; }
        #aeroCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; opacity: 0.6; }
        #dashboard { position: absolute; top: 0; left: 0; width: 100%; height: 110px; background: white; z-index: 2000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 2px solid #2c3e50; align-items: center; }
        .box { border-right: 1px solid #ccc; padding: 5px; text-align: center; }
        .label { font-size: 14px; font-weight: 800; color: #2980b9; display: block; text-transform: uppercase; }
        .val { font-size: 52px; font-weight: 900; color: #2c3e50; line-height: 1; }
        #wind-box { position: absolute; top: 130px; right: 20px; z-index: 2500; background: rgba(255,255,255,0.9); padding: 8px; border-radius: 50%; border: 2px solid #2c3e50; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; }
        #wind-arrow { width: 45px; height: 45px; transition: transform 0.2s linear; }
        #pilot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3000; width: 35px; pointer-events: none; }
        #agl-txt { color: #e67e22; }
        #signature-box { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 4000; background: rgba(255, 255, 255, 0.7); padding: 5px 15px; border-radius: 15px; border: 1px solid #2c3e50; font-family: "Comic Sans MS", cursive; font-size: 14px; font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>
<div id="signature-box">RG Project - AI FlyStream</div>
<div id="dashboard">
    <div class="box"><span class="label">Quota (m)</span><span id="alt-txt" class="val">---</span></div>
    <div class="box"><span class="label">Vento (km/h)</span><span id="spd-txt" class="val">---</span></div>
    <div class="box"><span class="label">AGL (m)</span><span id="agl-txt" class="val">---</span></div>
</div>
<div id="wind-box"><svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg></div>
<svg id="pilot" viewBox="0 0 24 24" fill="#3498db" stroke="white" stroke-width="1.5"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>
<div id="viewport"><div id="map"></div></div>
<canvas id="aeroCanvas"></canvas>

<script>
    const PUNTI_PER_GRADO = 1200;
    const STEP_METRI = 90;
    
    // PERCORSO RELATIVO (carica dalla cartella su GitHub)
    const PATH_JSON = "data_json/"; 
    
    let terrainData = null;
    let currentTile = "";
    let flight = { lat: 44.8, lon: 9.1, hdg: 0, alt: 0, windSpd: 0, windDir: 0 };

    const map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false }).setView([44.8, 9.1], 13);
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);
    const canvas = document.getElementById('aeroCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.onresize = resize; resize();

function updateFromXCTrack() {
        try {
            let xc = window.XCTrack || (window.parent && window.parent.XCTrack);
            if (xc && typeof xc.getLocation === 'function') {
                let data = JSON.parse(xc.getLocation());
                
                // Conversione sicura in numeri
                flight.lat = Number(data.lat); 
                flight.lon = Number(data.lon);
                flight.alt = Math.round(Number(data.altGps)); 
                flight.hdg = Number(data.heading || 0);
                
                // Correzione Vento: controlliamo che la proprietà esista, anche se è 0
                if (data.hasOwnProperty('windSpeed')) { 
                    flight.windSpd = Math.round(Number(data.windSpeed) * 3.6); 
                    flight.windDir = Number(data.windDirection || 0); 
                }
                
                updateView();
            }
        } catch (e) { console.error("Errore dati XCTrack:", e); }
    }

    async function updateView() {
        map.setView([flight.lat, flight.lon], 13, { animate: false });
        document.getElementById('map').style.transform = `rotate(${-flight.hdg}deg)`;
        document.getElementById('alt-txt').innerText = flight.alt;
        document.getElementById('spd-txt').innerText = flight.windSpd;
        const arrowRot = (flight.windDir - flight.hdg) + 180;
        document.getElementById('wind-arrow').style.transform = `rotate(${arrowRot}deg)`;

        let tID = `map_${Math.floor(flight.lat)}_${Math.floor(flight.lon)}`;
        if (currentTile !== tID) {
            try {
                // Carica il JSON direttamente dal server GitHub
                const response = await fetch(`${PATH_JSON}${tID}.json`);
                if (response.ok) {
                    const json = await response.json();
                    terrainData = json.data;
                    currentTile = tID;
                }
            } catch(e) { console.error("Dati non trovati sul server"); }
        }
        drawAnalysis();
    }

    function drawAnalysis() {
        if (!terrainData) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const wspd = flight.windSpd;
        const rad = (flight.windDir - 90) * (Math.PI / 180);
        const vx = -Math.cos(rad); const vy = Math.sin(rad);
        const res = 6; const rangeIdx = 0.045; 

        for (let x = 0; x < canvas.width; x += res) {
            for (let y = 0; y < canvas.height; y += res) {
                let relX = (x - canvas.width / 2) / (canvas.width / 2) * rangeIdx;
                let relY = -(y - canvas.height / 2) / (canvas.height / 2) * rangeIdx;
                const angleHdg = -flight.hdg * (Math.PI / 180);
                let pLon = flight.lon + (relX * Math.cos(angleHdg) - relY * Math.sin(angleHdg));
                let pLat = flight.lat + (relX * Math.sin(angleHdg) + relY * Math.cos(angleHdg));
                let cx = Math.floor((pLon % 1) * PUNTI_PER_GRADO);
                let cy = (PUNTI_PER_GRADO - 1) - Math.floor((pLat % 1) * PUNTI_PER_GRADO);

                if (terrainData[cy] && terrainData[cy][cx]) {
                    const h = terrainData[cy][cx];
                    if (Math.abs(x - canvas.width/2) < res && Math.abs(y - canvas.height/2) < res) {
                        document.getElementById('agl-txt').innerText = Math.round(flight.alt - h);
                    }
                    if (h >= flight.alt) { ctx.fillStyle = "rgba(40, 40, 40, 0.8)"; ctx.fillRect(x, y, res, res); continue; }
                    const gx = ((terrainData[cy][cx+1]||h)-(terrainData[cy][cx-1]||h))/(2*STEP_METRI);
                    const gy = ((terrainData[cy+1]?terrainData[cy+1][cx]:h)-(terrainData[cy-1]?terrainData[cy-1][cx]:h))/(2*STEP_METRI);
                    let localForce = (vx * gx + vy * gy) * (wspd / 10);
                    if (localForce < -0.12) ctx.fillStyle = "rgba(231, 76, 60, 0.7)";
                    else if (localForce > 0.08) ctx.fillStyle = "rgba(46, 204, 113, 0.6)";
                    else ctx.fillStyle = "rgba(0,0,0,0)";
                    ctx.fillRect(x, y, res, res);
                }
            }
        }
    }
    setInterval(updateFromXCTrack, 500);
</script>
</body>
</html>
