<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>RGproject_StandAlone_V3.2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* --- [REM] STILI BASE E VIEWPORT --- */
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        #map { position: absolute; top: 50%; left: 50%; width: 220vmax; height: 220vmax; margin-top: -110vmax; margin-left: -110vmax; transition: transform 0.2s linear; }
        #aeroCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1500; opacity: 0.6; }
        
        /* --- [REM] DASHBOARD DATI PRINCIPALI (ALTA) --- */
        #dashboard { position: absolute; top: 0; left: 0; width: 100%; height: 110px; background: white; z-index: 2000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-bottom: 2px solid #2c3e50; align-items: center; }
        .box { border-right: 1px solid #ccc; padding: 5px; text-align: center; }
        .label { font-size: 14px; font-weight: 800; color: #2980b9; display: block; text-transform: uppercase; }
        .val { font-size: 52px; font-weight: 900; color: #2c3e50; line-height: 1; }

        /* --- [REM] BOX VENTO (ALTO DESTRA) --- */
        #wind-main-container { position: absolute; top: 125px; right: 15px; z-index: 2500; }
        #wind-box { background: rgba(255,255,255,0.9); padding: 8px; border-radius: 50%; border: 2px solid #2c3e50; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; }
        #wind-arrow { width: 40px; height: 40px; transition: transform 0.3s linear; }
        #wind-deg-display { background: #2c3e50; color: white; border-radius: 4px; padding: 2px 8px; font-weight: bold; margin-top: 5px; text-align: center; font-size: 14px; }

        /* --- [REM] ZONA TECNICA BASSA (SOPRA FIRMA) --- */
        #bottom-tech-zone { 
            position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); 
            width: 95%; display: flex; justify-content: space-between; align-items: flex-end; z-index: 3000; 
        }

        /* [REM] Pannello Configurazione (Spostato in basso a sinistra) */
        #config-panel { background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 8px; border: 1.5px solid #2c3e50; font-size: 11px; font-weight: bold; min-width: 130px; }
        
        /* [REM] Box Affidabilità Vento (Spostato in basso a destra) */
        #reliability-panel { background: rgba(44, 62, 80, 0.95); color: white; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); min-width: 100px; font-family: monospace; }
        .rel-item { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; line-height: 1.4; }
        .rel-val { color: #f1c40f; font-weight: bold; }

        /* --- [REM] FIRMA E ICONA PILOTA --- */
        #signature-box { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 4000; background: rgba(255,255,255,0.85); padding: 5px 15px; border-radius: 20px; border: 1.5px solid #2c3e50; font-family: cursive; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .ver-tag { background: #2c3e50; color: white; padding: 1px 5px; border-radius: 4px; font-family: monospace; font-size: 10px; }
        #pilot { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5000; width: 35px; pointer-events: none; }
        #agl-txt { color: #e67e22; }
    </style>
</head>
<body>

<div id="dashboard">
    <div class="box"><span class="label">Quota (m)</span><span id="alt-txt" class="val">---</span></div>
    <div class="box"><span class="label">Vento (km/h)</span><span id="spd-txt" class="val">---</span></div>
    <div class="box"><span class="label">AGL (m)</span><span id="agl-txt" class="val">---</span></div>
</div>

<div id="wind-main-container">
    <div id="wind-box" onclick="toggleZoom()">
        <svg id="wind-arrow" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </div>
    <div id="wind-deg-display">0°</div>
</div>

<div id="bottom-tech-zone">
    <div id="config-panel">
        GPS: <span id="gps-status" style="color:red;">OFF</span> | <span id="wake-status" style="color:orange;">☕</span><br>
        <input type="checkbox" id="chkDynamic" checked> SCIA DINAMICA<br>
        <input type="checkbox" id="chkMapBN"> MAPPA B/N
    </div>

    <div id="reliability-panel">
        <div class="rel-item">🕒 <span id="rel-time" class="rel-val">0'</span></div>
        <div class="rel-item">📍 <span id="rel-dist" class="rel-val">0k</span></div>
        <div class="rel-item">🏔️ <span id="rel-alt" class="rel-val">0m</span></div>
    </div>
</div>

<div id="signature-box">RG Project Stand-Alone <span class="ver-tag">V.3.2.0</span></div>

<svg id="pilot" viewBox="0 0 24 24" fill="#3498db" stroke="white" stroke-width="1.5"><path d="M12 2L4.5 20.29L5.21 21L12 18L18.79 21L19.5 20.29L12 2Z"/></svg>

<div id="viewport"><div id="map"></div></div>
<canvas id="aeroCanvas"></canvas>

<script>
    /* ---------------------------------------------------------
       [ROUTINE: VARIABILI GLOBALI E STATO]
       --------------------------------------------------------- */
    const PUNTI_PER_GRADO = 1200;
    const STEP_METRI = 90;
    let terrainData = null, currentTile = "", map = null, canvas = null, ctx = null;
    let isDynamic = true, isBN = false, isTacticMode = false;
    let flight = { lat: 0, lon: 0, hdg: 0, alt: 0, windSpd: 0, windDir: 0 };
    let lastWindUpdate = { time: Date.now(), lat: 0, lon: 0, alt: 0 };
    let wakeLock = null;

    /* ---------------------------------------------------------
       [ROUTINE: INIZIALIZZAZIONE E WAKE LOCK]
       --------------------------------------------------------- */
    async function init() {
        canvas = document.getElementById('aeroCanvas');
        ctx = canvas.getContext('2d');
        
        map = L.map('map', { zoomControl: false, attributionControl: false, dragging: false }).setView([44.8, 9.1], 12);
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png').addTo(map);

        // [REM] Richiesta Wake Lock per impedire lo spegnimento schermo
        requestWakeLock();

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
        }

        document.getElementById('chkDynamic').addEventListener('change', (e) => isDynamic = e.target.checked);
        document.getElementById('chkMapBN').addEventListener('change', (e) => { isBN = e.target.checked; applyMapStyle(); });
        
        window.onresize = resize;
        resize();
        setInterval(refreshReliabilityUI, 5000);
    }

    // [REM] Funzione dedicata al blocco spegnimento schermo
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('wake-status').style.color = "green";
                wakeLock.addEventListener('release', () => { console.log('Wake Lock rilasciato'); });
            }
        } catch (err) {
            document.getElementById('wake-status').style.color = "red";
            console.error(`${err.name}, ${err.message}`);
        }
    }

    /* ---------------------------------------------------------
       [ROUTINE: AGGIORNAMENTO DATI E UI]
       --------------------------------------------------------- */
    function updatePosition(pos) {
        document.getElementById('gps-status').innerText = "LIVE";
        document.getElementById('gps-status').style.color = "green";
        flight.lat = pos.coords.latitude;
        flight.lon = pos.coords.longitude;
        flight.alt = Math.round(pos.coords.altitude || 0);
        flight.hdg = pos.coords.heading || 0;
        updateView();
    }

    function refreshReliabilityUI() {
        let diffMin = Math.floor((Date.now() - lastWindUpdate.time) / 60000);
        document.getElementById('rel-time').innerText = diffMin + "'";
        if (lastWindUpdate.lat !== 0) {
            let d = calculateDist(flight.lat, flight.lon, lastWindUpdate.lat, lastWindUpdate.lon);
            document.getElementById('rel-dist').innerText = d.toFixed(1) + "k";
        }
        document.getElementById('rel-alt').innerText = lastWindUpdate.alt + "m";
    }

    function calculateDist(lat1, lon1, lat2, lon2) {
        const R = 6371;
        let dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
        let a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function updateView() {
        if (flight.lat === 0) return;
        map.setView([flight.lat, flight.lon], map.getZoom(), { animate: false });
        document.getElementById('map').style.transform = `rotate(${-flight.hdg}deg)`;
        document.getElementById('alt-txt').innerText = flight.alt;
        document.getElementById('spd-txt').innerText = flight.windSpd;
        
        let arrowRot = (flight.windDir - flight.hdg) + 180;
        document.getElementById('wind-arrow').style.transform = `rotate(${arrowRot}deg)`;
        document.getElementById('wind-deg-display').innerText = Math.round(flight.windDir) + "°";

        let tID = `map_${Math.floor(flight.lat)}_${Math.floor(flight.lon)}`;
        if (currentTile !== tID) {
            try {
                let res = await fetch(`data_json/${tID}.json`);
                if (res.ok) { terrainData = (await res.json()).data; currentTile = tID; }
            } catch(e) {}
        }
        drawAnalysis();
    }

    /* ---------------------------------------------------------
       [ROUTINE: DISEGNO ANALISI OROGRAFICA]
       --------------------------------------------------------- */
    function drawAnalysis() {
        if (!terrainData) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let wspd = flight.windSpd, wdir = flight.windDir;
        let rad = (wdir - 90) * (Math.PI / 180);
        let vx = -Math.cos(rad), vy = Math.sin(rad);
        let res = 6, rangeIdx = 0.045 / Math.pow(2, (map.getZoom() - 12));
        let dropValue = Math.max(8, 40 - (wspd * 0.8));
        let maxSteps = isDynamic ? Math.min(16, Math.floor(wspd / 1.5) + 4) : 6;

        for (let x = 0; x < canvas.width; x += res) {
            for (let y = 0; y < canvas.height; y += res) {
                let relX = (x - canvas.width / 2) / (canvas.width / 2) * rangeIdx;
                let relY = -(y - canvas.height / 2) / (canvas.height / 2) * rangeIdx;
                let aH = -flight.hdg * (Math.PI / 180);
                let pLon = flight.lon + (relX * Math.cos(aH) - relY * Math.sin(aH));
                let pLat = flight.lat + (relX * Math.sin(aH) + relY * Math.cos(aH));
                let cx = Math.floor((pLon % 1) * PUNTI_PER_GRADO), cy = (PUNTI_PER_GRADO - 1) - Math.floor((pLat % 1) * PUNTI_PER_GRADO);
                
                if (terrainData[cy] && terrainData[cy][cx]) {
                    let h = terrainData[cy][cx];
                    if (Math.abs(x - canvas.width/2) < res && Math.abs(y - canvas.height/2) < res) document.getElementById('agl-txt').innerText = Math.round(flight.alt - h);
                    if (h >= flight.alt) { ctx.fillStyle = "rgba(40,40,40,0.8)"; ctx.fillRect(x,y,res,res); continue; }
                    let inWake = false;
                    for (let d = 1; d <= maxSteps; d++) {
                        let lx = Math.floor(((pLon - vx*0.00025*d) % 1) * PUNTI_PER_GRADO), ly = (PUNTI_PER_GRADO-1) - Math.floor(((pLat - vy*0.00025*d) % 1) * PUNTI_PER_GRADO);
                        if (terrainData[ly] && terrainData[ly][lx] > (flight.alt - (d * dropValue))) { inWake = true; break; }
                    }
                    let gx = ((terrainData[cy][cx+1]||h)-(terrainData[cy][cx-1]||h))/(2*STEP_METRI), gy = ((terrainData[cy+1]?terrainData[cy+1][cx]:h)-(terrainData[cy-1]?terrainData[cy-1][cx]:h))/(2*STEP_METRI);
                    let force = (vx * gx + vy * gy) * (wspd / 10);
                    if (inWake) ctx.fillStyle = "rgba(100,100,100,0.6)";
                    else if (force < -0.12) ctx.fillStyle = "rgba(231,76,60,0.7)";
                    else if (force > 0.08) ctx.fillStyle = "rgba(46,204,113,0.6)";
                    else ctx.fillStyle = "rgba(0,0,0,0)";
                    ctx.fillRect(x,y,res,res);
                }
            }
        }
    }

    function toggleZoom() {
        isTacticMode = !isTacticMode;
        map.setZoom(isTacticMode ? 14.6 : 12, { animate: true });
    }

    function applyMapStyle() { document.getElementById('map').style.filter = isBN ? "grayscale(1) contrast(1.8) opacity(0.8)" : "none"; }
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    init();
</script>
</body>
</html>
